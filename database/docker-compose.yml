services:
  db:
    image: postgres:16-alpine
    container_name: skillswap-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillswap}
      POSTGRES_USER: ${POSTGRES_USER:-skillswap_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configura APP_DB_PASSWORD en .env}
      LECTURA_DB_PASSWORD: ${LECTURA_DB_PASSWORD:?Configura LECTURA_DB_PASSWORD en .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Configura APP_ENCRYPTION_KEY en .env}
      APP_HASH_PEPPER: ${APP_HASH_PEPPER:?Configura APP_HASH_PEPPER en .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skillswap_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  skillswap_pgdata:
