name: nexo-u-phase2-mail
services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-4104}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-11026}:1025'
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: 'true'
    volumes:
      - inbox:/data
volumes:
  inbox:
